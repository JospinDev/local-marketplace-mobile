name: marketplace_burundi
description: "Marketplace Burundi — application mobile multi-vendeurs."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- etat ------------------------------------------------------------
  # Riverpod : providers types, verifies a la compilation, testables sans
  # widget. Choisi plutot que Bloc pour la concision a cette taille.
  flutter_riverpod: ^2.6.1

  # --- navigation -------------------------------------------------------
  # go_router centralise les redirections d'authentification en un seul
  # endroit, au lieu de les eparpiller dans chaque ecran.
  go_router: ^14.6.2

  # --- reseau -----------------------------------------------------------
  dio: ^5.7.0

  # --- stockage ---------------------------------------------------------
  # Les jetons vont dans le trousseau du systeme, jamais dans les
  # preferences en clair (regle du guide d'integration).
  flutter_secure_storage: ^9.2.2

  # --- interface --------------------------------------------------------
  google_fonts: ^6.2.1

  # --- animations -------------------------------------------------------
  # flutter_animate : enchainements declaratifs (.fadeIn().slideY()),
  # bien plus lisibles qu'un AnimationController par effet.
  flutter_animate: ^4.5.2
  image_picker: ^1.2.4
  web_socket_channel: ^3.0.3
  url_launcher: ^6.3.3

  # ----------------------------------------------------------------------
  # AJOUTES A LEUR ETAPE, PAS AVANT.
  #
  # Chaque paquet avec du code natif allonge la compilation Android et,
  # sur une connexion lente, peut la faire echouer : `image_picker`
  # epinglait a lui seul une SECONDE version du plugin Kotlin (2.3.20 en
  # plus de la 2.4.0 du projet), dont le telechargement expirait.
  #
  #   etape 3 : cached_network_image, shimmer   (images et squelettes)
  #   etape 4 : image_picker                    (photos d'annonces)
  #   etape 6 : web_socket_channel              (messagerie temps reel)
  #   etape 8 : intl                            (dates et montants)
  # ----------------------------------------------------------------------

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/branding/

# ---------------------------------------------------------------- icones
# `dart run flutter_launcher_icons` regenere les icones Android et iOS.
#
# Deux images, et non une : l'icone adaptative d'Android compose un
# premier plan transparent sur un fond uni, et le systeme la recadre
# librement — d'ou la marge interieure large de `symbole.png`. Les icones
# heritees, elles, ne gerent pas la transparence : `icone.png` porte donc
# deja son fond blanc.
flutter_launcher_icons:
  image_path: assets/branding/icone.png
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/symbole.png
  adaptive_icon_monochrome: assets/branding/symbole.png
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21

# ------------------------------------------------------- ecran d'ouverture
# `dart run flutter_native_splash:create` remplace l'ecran blanc par le
# logo complet.
#
# Le fond reste clair en mode sombre comme en mode clair : les contre-
# formes des lettres du logo sont blanches et opaques, elles trancheraient
# sur un fond fonce.
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#FFFFFF"
  image: assets/branding/logo.png
  image_dark: assets/branding/logo.png
  android_12:
    # Android 12 impose une icone ronde et centree : le symbole seul s'y
    # prete, le logo avec son texte y serait illisible une fois rogne.
    image: assets/branding/symbole.png
    image_dark: assets/branding/symbole.png
    color: "#FFFFFF"
    color_dark: "#FFFFFF"
  android: true
  ios: true
  web: false
